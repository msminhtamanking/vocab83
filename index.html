ild a genuine connection", "o": "sound like a sales pitch", "e": "Good copy should connect with your audience instead of sounding like another sales pitch.", "eo": "That email sounded like just another sales pitch, not a genuine connection.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 15.0}, {"id": 15, "w": "Push them away / Be ignored / Be treated like ads", "i": "", "m": "đẩy họ ra xa / bị phớt lờ / bị coi như quảng cáo", "c": "push customers away; get ignored; be treated like an ad", "o": "draw them in / earn their attention", "e": "Overly aggressive messaging can push customers away and get ignored.", "eo": "A genuine, helpful message will draw them in instead of pushing them away.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 15.5}, {"id": 16, "w": "Don't be pushy", "i": "", "m": "đừng ép buộc", "c": "avoid being pushy; come across as pushy", "o": "be gentle / take a soft approach", "e": "Don't be pushy in your follow-up emails — give customers space to decide.", "eo": "Take a soft approach instead, and let the customer come to you.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 16.0}, {"id": 17, "w": "Recover sales / Bring them back / Reignite interest", "i": "", "m": "cứu vãn doanh số, kéo khách quay lại", "c": "recover lost sales; bring customers back; reignite their interest", "o": "lose them for good", "e": "A well-timed discount email can recover sales and reignite interest.", "eo": "If you wait too long, you might lose them for good.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 17.0}, {"id": 18, "w": "Build an amazing audience / Grow your audience / Grow leads list", "i": "", "m": "xây dựng và phát triển lượng khán giả", "c": "build an audience; grow your leads list", "o": "let your audience shrink", "e": "Consistent content helps you build an amazing audience and grow your leads list.", "eo": "Inconsistent posting will let your audience shrink over time.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 18.0}, {"id": 19, y.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 37.0}, {"id": 40, "w": "Go-to / Well-known / Industry-standard", "i": "", "m": "lựa chọn số một, tiêu chuẩn ngành", "c": "the go-to solution; a well-known brand; the industry standard", "o": "obscure / niche", "e": "This tool has become the go-to, industry-standard choice for marketers.", "eo": "That software remains obscure and niche in comparison.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 38.0}, {"id": 41, "w": "Top-performing / Best-in-class / Elite / World-class / Cream of the crop", "i": "", "m": "xuất sắc nhất, hàng đầu", "c": "a top-performing campaign; best-in-class service; world-class copywriting", "o": "mediocre / average", "e": "Our team delivers top-performing, best-in-class, world-class copywriting.", "eo": "Their results were mediocre and average at best.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 39.0}, {"id": 42, "w": "Staggering", "i": "", "m": "gây choáng (số liệu/ROI)", "c": "a staggering ROI; staggering numbers", "o": "unremarkable", "e": "The campaign delivered a staggering ROI within the first month.", "eo": "The results from last quarter were unremarkable.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 40.0}, {"id": 43, "w": "Pushy / Aggressive / Hard-selling / Salesy / Overbearing", "i": "", "m": "quá nhiệt tình mang tính ép buộc, xồn xồn", "c": "a pushy salesperson; an aggressive pitch; hard-selling tactics", "o": "gentle / low-pressure", "e": "Customers dislike pushy, hard-selling, overbearing sales tactics.", "eo": "A gentle, low-pressure approach builds more trust.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 41.0}, {"id": 44, "w": "Weak / Forgettable / Fails to convert / Doesn't land / Falls flat / Pointless / Irrelevant / Rendered invisible", "i": "", "m": "yếu, dễ quên, không chuyển đổi", "c": "weak copy; a forgettable headline; fails to convert", "o": "strong / memorable / high-converting", "e": "The old headline was weak, forgettable, and failed to convert.", "eo": "The new version is strong, memorable, and high-converting.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 42.0}, {"id": 45, "w": "Choppy / Rigid / Sterile", "i": "", "m": "rời rạc, cứng nhắc, khô khan", "c": "choppy writing; a rigid structure; sterile tone", "o": "fluid / warm / natural", "e": "The old copy felt choppy, rigid, and sterile.", "eo": "The revised version feels fluid, warm, and natural.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 43.0}, {"id": 46, "w": "Swipe file (build / save to / study / open)", "i": "", "m": "thư viện mẫu copy hay", "c": "build a swipe file; save an ad to your swipe file; study your swipe file", "o": "start from a blank page", "e": "She built a swipe file of high-converting headlines to study before writing.", "eo": "Without a swipe file, he had to start from a blank page every time.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 44.0}, {"id": 47, "w": "blank page", "i": "", "m": "trang giấy trắng", "c": "stare at a blank page; face a blank page", "o": "a finished draft", "e": "Every writer knows the fear of staring at a blank page.", "eo": "By the end of the session, she had a finished draft instead of a blank page.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 45.0}, {"id": 48, "w": "flow (ideas / conversation / first draft / work)", "i": "", "m": "mạch chảy, trình tự", "c": "get into a flow; a natural flow of ideas", "o": "get stuck / hit a wall", "e": "Once she got into a flow, the ideas came naturally.", "eo": "He hit a wall and couldn't get into a flow at all.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 46.0}, {"id": 49, "w": "to warm them up", "i": "", "m": "làm ấm khách hàng", "c": "warm up your audience; warm up cold leads", "o": "pitch cold leads directly", "e": "A short email sequence helps warm up your audience before the pitch.", "eo": "Pitching cold leads directly usually leads to low conversion.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 47.0}, {"id": 50, "w": "to build trust / relationship / earn their trust", "i": "", "m": "xây dựng lòng tin", "c": "build trust; earn someone's trust; build a relationship", "o": "break trust / lose credibility", "e": "Consistent value builds trust and earns their loyalty over time.", "eo": "One dishonest claim can break trust and destroy credibility.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 48.0}, {"id": 51, "w": "to lead them to your product", "i": "", "m": "dẫn dắt đến sản phẩm", "c": "lead customers to your product; guide them toward a purchase", "o": "leave them confused about what to do next", "e": "Every piece of content should lead them to your product naturally.", "eo": "Vague messaging leaves them confused about what to do next.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 49.0}, {"id": 52, "w": "to overcome doubt / hesitation", "i": "", "m": "vượt qua nghi ngờ", "c": "overcome doubt; address hesitation; ease their doubts", "o": "raise doubt / trigger hesitation", "e": "Social proof helps overcome doubt and hesitation before checkout.", "eo": "Hidden fees can raise doubt and trigger hesitation at the last step.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 50.0}, {"id": 53, "w": "to create urgency", "i": "", "m": "tạo sự khẩn cấp", "c": "create urgency; add a sense of urgency", "o": "remove urgency / let them wait", "e": "A countdown timer helps create urgency on the sales page.", "eo": "An open-ended offer removes urgency and lets buyers wait.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 51.0}, {"id": 54, "w": "to bring in an ROI", "i": "", "m": "mang lại ROI", "c": "bring in a strong ROI; deliver a positive ROI", "o": "fail to deliver a return", "e": "The campaign brought in a solid ROI within two weeks.", "eo": "The last campaign failed to deliver any real return.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 52.0}, {"id": 55, "w": "Front-end (top of funnel): Lead magnet → Tripwire → Core offer", "i": "", "m": "phễu phía trước", "c": "offer a lead magnet; run a tripwire offer; promote the core offer", "o": "", "e": "The front-end funnel starts with a lead magnet, moves to a tripwire, then the core offer.", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 53.0}, {"id": 56, "w": "Back-end (bottom of funnel): Upsell → Downsell → High-ticket offer", "i": "", "m": "phễu phía sau", "c": "offer an upsell; present a downsell; sell a high-ticket offer", "o": "", "e": "In the back-end, we present an upsell, a downsell, and finally a high-ticket offer.", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 54.0}, {"id": 57, "w": "Give audience enough reasons to say yes / Make the offer unmissable", "i": "", "m": "đưa đủ lý do để khách đồng ý", "c": "give enough reasons to say yes; make an offer unmissable", "o": "give them a reason to hesitate", "e": "Stack enough bonuses to give your audience enough reasons to say yes.", "eo": "Vague benefits give them a reason to hesitate instead.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 55.0}, {"id": 58, "w": "Stack value", "i": "", "m": "chồng chất giá trị", "c": "stack value; stack bonuses", "o": "strip away value", "e": "We stacked value with bonuses until the offer felt like a no-brainer.", "eo": "Cutting bonuses strips away the value that made the offer compelling.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 56.0}, {"id": 59, "w": "Give them enough reasons to refer new clients (v) ; Referral (n)", "i": "", "m": "tạo động lực giới thiệu", "c": "refer new clients; earn a referral", "o": "give no reason to refer anyone", "e": "A great experience gives customers enough reasons to refer new clients.", "eo": "Poor service gives no reason to refer anyone.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 57.0}, {"id": 60, "w": "Value proposition (unique/strong/craft) / Competitive edge", "i": "", "m": "đề xuất giá trị; lợi thế cạnh tranh", "c": "craft a value proposition; a unique value proposition; a competitive edge", "o": "a weak value proposition", "e": "Your value proposition promises premium quality — but if customers still feel like it's too much, your value perception hasn't caught up with your positioning.", "eo": "A weak value proposition fails to set you apart from competitors.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 58.0}, {"id": 61, "w": "Abandon the cart / Leave the cart / Drop off at checkout", "i": "", "m": "bỏ giỏ hàng, rời khỏi quy trình thanh toán", "c": "abandon the cart; drop off at checkout", "o": "complete the checkout", "e": "Nearly 70% of shoppers abandon the cart before completing checkout.", "eo": "A simplified process encourages more shoppers to complete the checkout.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 59.0}, {"id": 62, "w": "Recover lost sales / Capture revenue", "i": "", "m": "cứu vãn doanh số bị mất / thu hút doanh thu", "c": "recover lost sales; capture missed revenue", "o": "let revenue slip away", "e": "Abandoned cart emails help recover lost sales and capture revenue.", "eo": "Without follow-up, you let that revenue slip away.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 59.5}, {"id": 63, "w": "Complete the checkout / purchase / order", "i": "", "m": "hoàn tất thanh toán", "c": "complete the checkout; finalize the purchase", "o": "abandon the order", "e": "A one-click option makes it easy to complete the checkout.", "eo": "Confusing forms make shoppers abandon the order.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 60.0}, {"id": 64, "w": "Redeem a referral discount / Claim the referral reward", "i": "", "m": "đổi mã giới thiệu / nhận phần thưởng giới thiệu", "c": "redeem a discount; claim a reward", "o": "forfeit the reward", "e": "Customers can redeem a referral discount or claim the referral reward instantly.", "eo": "If they don't act in time, they forfeit the reward.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 61.0}, {"id": 65, "w": "Share to unlock a bonus", "i": "", "m": "chia sẻ để nhận quà", "c": "unlock a bonus; share to earn a reward", "o": "", "e": "Refer 3 friends and unlock a free month; Share your link to claim your discount", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 62.0}, {"id": 66, "w": "Refer a friend and get X% off", "i": "", "m": "giới thiệu bạn bè và được giảm X%", "c": "refer a friend; get a percentage off", "o": "", "e": "Refer a friend and get 20% off your next order.", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 62.5}, {"id": 67, "w": "Complimentary / At no cost / Zero cost", "i": "", "m": "miễn phí", "c": "complimentary shipping; at no extra cost", "o": "come at a premium", "e": "Come at a cost; On me", "eo": "That add-on comes at a premium, unlike the free version.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 63.0}, {"id": 68, "w": "Worth your time / worth the risk / worth every dollar / worth it", "i": "", "m": "đáng giá", "c": "worth the investment; worth every dollar", "o": "not worth it / a waste of money", "e": "The course is worth every dollar and worth your time.", "eo": "Some tools turn out to be a waste of money.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 64.0}, {"id": 69, "w": "Nobody ignores free value", "i": "", "m": "không ai bỏ qua giá trị miễn phí", "c": "", "o": "", "e": "Nobody ignores free value, especially when it solves a real problem.", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 65.0}, {"id": 70, "w": "Feel like a bargain / No-brainer", "i": "", "m": "cảm thấy rẻ, dễ quyết định", "c": "feel like a bargain; an absolute no-brainer", "o": "feel overpriced", "e": "At that price, the deal feels like a bargain — a total no-brainer.", "eo": "At full price, the same product feels overpriced.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 66.0}, {"id": 71, "w": "An absurdly low price", "i": "", "m": "giá cực thấp", "c": "an absurdly low price; a rock-bottom price", "o": "an outrageously high price", "e": "They launched the product at an absurdly low, rock-bottom price.", "eo": "Competitors charge an outrageously high price for the same thing.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 67.0}, {"id": 72, "w": "Turn hesitant leads into one-time / repeat / consistent / loyal buyers", "i": "", "m": "biến khách do dự thành khách trung thành", "c": "turn leads into buyers; turn hesitant leads into loyal customers", "o": "lose leads for good", "e": "A strong follow-up sequence turns hesitant leads into loyal buyers.", "eo": "Without follow-up, you risk losing those leads for good.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 68.0}, {"id": 73, "w": "Turn visitors into paying customers", "i": "", "m": "biến khách truy cập thành khách trả tiền", "c": "turn visitors into customers; convert visitors into buyers", "o": "lose visitors without converting", "e": "A clear CTA helps turn visitors into paying customers.", "eo": "A slow page will lose visitors without converting them.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 69.0}, {"id": 74, "w": "Feel like too much and say no", "i": "", "m": "cảm thấy quá đắt và từ chối", "c": "feel like too much; say no to an offer", "o": "feel like a steal and say yes", "e": "At that price, the offer felt like too much, so she said no.", "eo": "With a discount, it felt like a steal, so he said yes.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 70.0}, {"id": 75, "w": "Full price / Pay full price", "i": "", "m": "giá gốc", "c": "pay full price; sell at full price", "o": "pay a discounted price", "e": "Loyal customers are often willing to pay full price.", "eo": "New customers usually pay a discounted price first.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 71.0}, {"id": 76, "w": "Keep the relationship alive / Save / Maintain / Nurture the relationship", "i": "", "m": "giữ mối quan hệ", "c": "nurture the relationship; keep the relationship alive", "o": "let the relationship fade", "e": "Regular check-ins help nurture and maintain the relationship with clients.", "eo": "Ignoring past clients lets the relationship fade over time.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 72.0}, {"id": 77, "w": "Keep them coming back", "i": "", "m": "giữ khách quay lại", "c": "keep customers coming back; keep them coming back for more", "o": "lose them after one purchase", "e": "A loyalty program keeps them coming back for more.", "eo": "Poor after-sales service can make you lose them after one purchase.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 73.0}, {"id": 78, "w": "Cashback program", "i": "", "m": "chương trình hoàn tiền", "c": "launch a cashback program; join a cashback program", "o": "", "e": "The store launched a cashback program to encourage repeat purchases.", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 74.0}, {"id": 79, "w": "Perk", "i": "", "m": "quyền lợi thêm (đặc quyền)", "c": "offer a perk; enjoy a perk", "o": "", "e": "Free shipping is a nice perk for loyal members.", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 75.0}, {"id": 80, "w": "Benefits outweigh the costs", "i": "", "m": "lợi ích lớn hơn chi phí", "c": "the benefits outweigh the costs", "o": "the costs outweigh the benefits", "e": "For most customers, the benefits clearly outweigh the costs.", "eo": "For a few, the costs outweigh the benefits, so they cancel.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 76.0}, {"id": 81, "w": "Run the front-end at a loss to acquire customers", "i": "", "m": "chấp nhận lỗ ở front-end để có khách", "c": "run at a loss; acquire customers at a loss", "o": "run at a profit", "e": "Many businesses run the front-end at a loss just to acquire customers.", "eo": "Once trust is built, they run the core offer at a profit.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 77.0}, {"id": 82, "w": "Run the core offer at a profit", "i": "", "m": "chạy sản phẩm chính có lãi", "c": "run at a profit; sell at a healthy margin", "o": "run at a loss", "e": "The core offer runs at a profit once customer acquisition costs are covered.", "eo": "The front-end product runs at a loss to bring people in.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 77.5}, {"id": 83, "w": "Sell at a premium once trust is built", "i": "", "m": "bán giá cao khi đã có niềm tin", "c": "sell at a premium; charge a premium price", "o": "sell at a discount", "e": "Once trust is built, you can sell at a premium price.", "eo": "Early on, it's common to sell at a discount to attract buyers.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 78.0}, {"id": 84, "w": "In-stream / Paid", "i": "", "m": "quảng cáo in-stream / quảng cáo trả phí", "c": "in-stream ads; paid promotion", "o": "organic / unpaid", "e": "In-stream and paid ads reach viewers directly inside the video.", "eo": "Organic, unpaid content takes longer to build reach.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 79.0}, {"id": 85, "w": "Split test / Run a split test on", "i": "", "m": "chạy split test", "c": "run a split test; conduct an A/B test", "o": "", "e": "Choose what works; Pivot from A to B; Know for sure", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 80.0}, {"id": 86, "w": "Spend a cent on ads → Add paid traffic → Speed things up", "i": "", "m": "chi tiền quảng cáo để tăng tốc", "c": "spend a cent on ads; add paid traffic; speed things up", "o": "rely solely on organic traffic", "e": "Without spending a cent on ads, growth stayed slow until they added paid traffic to speed things up.", "eo": "Some brands prefer to rely solely on organic traffic instead.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 81.0}, {"id": 87, "w": "YT channels → Leverage VSLs", "i": "", "m": "kênh YouTube, tận dụng VSL", "c": "run a YouTube channel; leverage a VSL", "o": "", "e": "They grew their YouTube channel and leveraged VSLs to boost conversions.", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 82.0}, {"id": 88, "w": "Build personal brand → Creator selling info products", "i": "", "m": "xây dựng thương hiệu cá nhân", "c": "build a personal brand; sell info products as a creator", "o": "", "e": "She built a personal brand and became a creator selling info products.", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 83.0}, {"id": 89, "w": "Open rate → Check / Track", "i": "", "m": "tỷ lệ mở email", "c": "check the open rate; track the open rate", "o": "ignore the open rate", "e": "We track the open rate every week to gauge subject line performance.", "eo": "Some marketers ignore the open rate and focus only on clicks.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 84.0}, {"id": 90, "w": "Bounce rate → High / Optimize / Reduce", "i": "", "m": "tỷ lệ bounce", "c": "a high bounce rate; optimize the bounce rate; reduce bounce rate", "o": "a low bounce rate", "e": "We optimized the page to reduce a high bounce rate.", "eo": "The new design achieved a low bounce rate instead.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 85.0}, {"id": 91, "w": "Click-through rate (CTR) → Low / Boost / Increase / Enhance / Improve", "i": "", "m": "tỷ lệ nhấp chuột", "c": "boost the CTR; a low click-through rate", "o": "", "e": "Benchmark (v/n) — benchmark your CTR against the industry average", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 86.0}, {"id": 92, "w": "Conversion rate", "i": "", "m": "tỷ lệ chuyển đổi", "c": "increase the conversion rate; a high conversion rate", "o": "a low conversion rate", "e": "We increased the conversion rate by simplifying the checkout.", "eo": "The old page had a frustratingly low conversion rate.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 87.0}, {"id": 93, "w": "ROI (Measure / Positive / Maximize)", "i": "", "m": "ROI", "c": "measure the ROI; a positive ROI; maximize ROI", "o": "a negative ROI", "e": "We measured the ROI and worked to maximize a positive return.", "eo": "The failed campaign ended up with a negative ROI.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 88.0}, {"id": 94, "w": "Send out weekly newsletters to X subscribers", "i": "", "m": "gửi bản tin hàng tuần", "c": "send a newsletter; grow the subscriber list", "o": "", "e": "Land in their inbox consistently; Actually connects instead of sounding like a sales pitch; Receive no emails since the initial confirmation ones (negative)", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 89.0}, {"id": 95, "w": "Pages (Opt-in page / Landing page / Sales page)", "i": "", "m": "các loại trang web", "c": "build an opt-in page; design a landing page; write a sales page", "o": "", "e": "We built an opt-in page, a landing page, and a sales page for the launch.", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 90.0}, {"id": 96, "w": "Hook (create/write/craft/compelling/strong)", "i": "", "m": "đoạn mở đầu hấp dẫn", "c": "craft a hook; write a compelling hook", "o": "", "e": "Catch their eye; Capture attention; Stop the scroll; Disarm (attention); Hijack (attention)", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 91.0}, {"id": 97, "w": "Headline (write/test/compelling/irresistible/high-converting/well-crafted/polished/punchy)", "i": "", "m": "tiêu đề", "c": "write a headline; test a headline; a compelling headline", "o": "", "e": "You deserve copy that matches the quality of what you're already putting out", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 92.0}, {"id": 98, "w": "VSLs (leverage/hybrid-style)", "i": "", "m": "video bán hàng", "c": "leverage a VSL; a hybrid-style VSL", "o": "", "e": "Adding a video to your landing page; Retain 95% of a message when watched", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 93.0}, {"id": 99, "w": "Social proof (add/show/use)", "i": "", "m": "bằng chứng xã hội (đánh giá, case study)", "c": "add social proof; show testimonials", "o": "lack social proof", "e": "Stand out; Answer the question Why you not others?; An obvious choice; Handle objections head-on; Display logos of major brands; Provide extensive testimonials; Star ratings; Back every claim with proprietary consulting data; Document everything; Deliver real work", "eo": "A page that lacks social proof struggles to earn trust.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 94.0}, {"id": 100, "w": "Generic pitch / Sound like everyone else / Blend in", "i": "", "m": "giống như mọi đối thủ", "c": "give a generic pitch; sound like everyone else; blend in with competitors", "o": "stand out from the crowd", "e": "Their pitch was generic — it sounded like everyone else and just blended in.", "eo": "A bold angle helps you stand out from the crowd instead.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 94.5}, {"id": 101, "w": "Talk big but show zero proof", "i": "", "m": "hứa suông mà không có bằng chứng", "c": "talk big; show zero proof", "o": "back up claims with proof", "e": "That ad talked big but showed zero proof to support the claims.", "eo": "The best brands back up every claim with real proof.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 94.7}, {"id": 102, "w": "Hear big promises and feel fooled", "i": "", "m": "nghe hứa hẹn lớn và cảm thấy bị lừa", "c": "hear big promises; feel fooled", "o": "feel reassured by honest claims", "e": "Customers heard big promises and later felt fooled when results didn't match.", "eo": "Honest, modest claims left customers feeling reassured instead.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 94.9}, {"id": 103, "w": "Leave sth unresolved / unanswered", "i": "", "m": "bỏ ngỏ, không giải quyết", "c": "leave a question unanswered; leave an issue unresolved", "o": "resolve the issue", "e": "Don't leave a customer's objection unresolved or unanswered.", "eo": "A good FAQ section resolves the issue before it becomes a doubt.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 95.0}, {"id": 104, "w": "Pricing table → needs a redesign", "i": "", "m": "bảng giá cần chỉnh sửa", "c": "redesign the pricing table; update the pricing table", "o": "leave the pricing table as is", "e": "Feedback showed the pricing table needed a redesign.", "eo": "Some teams choose to leave the pricing table as is despite complaints.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 96.0}, {"id": 105, "w": "CTA (place/button/click/create/strong/add) → Passive text", "i": "", "m": "lời kêu gọi hành động", "c": "place a CTA; create a strong CTA button", "o": "use passive text", "e": "We created a strong CTA button instead of relying on passive text.", "eo": "The old page used passive text instead of a clear CTA.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 97.0}, {"id": 106, "w": "Lands on your website", "i": "", "m": "khách vừa vào web", "c": "land on a website; land on a page", "o": "bounce off a website", "e": "The moment a visitor lands on your website, first impressions matter.", "eo": "A slow load time makes visitors bounce off the website instantly.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 98.0}, {"id": 107, "w": "Bounce (from/experience/suffer/have a massive bounce)", "i": "", "m": "thoát trang", "c": "bounce from a page; experience a high bounce rate", "o": "stay engaged on a page", "e": "The site suffered a massive bounce because the page loaded too slowly.", "eo": "A fast, clear page keeps visitors engaged instead of bouncing.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 99.0}, {"id": 108, "w": "Click away from the pricing page instantly", "i": "", "m": "rời khỏi trang giá ngay", "c": "click away from a page; leave a page instantly", "o": "stay on the page to explore", "e": "Confusing pricing made visitors click away from the page instantly.", "eo": "Clear pricing made them stay on the page to explore further.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 100.0}, {"id": 109, "w": "Target audience (define/understand/reach/engage with)", "i": "", "m": "chân dung khách hàng mục tiêu", "c": "define your target audience; understand your audience; reach your target audience", "o": "target the wrong audience", "e": "You have to define and understand your target audience before writing copy.", "eo": "Targeting the wrong audience wastes ad spend.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 101.0}, {"id": 110, "w": "Pain point (identify/speak directly to/address) → Pleasure point", "i": "", "m": "điểm đau, điểm hài lòng", "c": "identify a pain point; address a pain point; speak to a pleasure point", "o": "", "e": "Validate offer/claim/which one converts/a feeling", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 102.0}, {"id": 111, "w": "Distracted / Unsure / Still deciding / Window shopping → Feel confident hitting buy now", "i": "", "m": "hành vi của khách hàng", "c": "window shop; feel unsure about a purchase", "o": "feel confident hitting buy now", "e": "Many shoppers are distracted, unsure, and still window shopping.", "eo": "Good copy makes them feel confident hitting buy now.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 103.0}, {"id": 112, "w": "General public → feel like you're talking to no one", "i": "", "m": "nói chung chung, không chạm đến ai", "c": "target the general public; talk to no one in particular", "o": "speak directly to one person", "e": "Writing for the general public can feel like you're talking to no one.", "eo": "Writing to speak directly to one person makes copy far more personal.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 104.0}, {"id": 113, "w": "Narrow down to one thing", "i": "", "m": "thu hẹp đối tượng, tập trung", "c": "narrow down your focus; narrow it down to one thing", "o": "spread yourself too thin", "e": "Narrow your message down to one thing instead of covering everything.", "eo": "Trying to say everything spreads your message too thin.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 105.0}, {"id": 114, "w": "Matching value to different customer needs", "i": "", "m": "căn chỉnh giá trị theo nhu cầu khách hàng", "c": "match value to customer needs; align value with needs", "o": "mismatch value and needs", "e": "Good segmentation means matching value to different customer needs.", "eo": "A one-size-fits-all offer mismatches value and needs.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 106.0}, {"id": 115, "w": "Tailor your offer to what each segment truly wants", "i": "", "m": "tùy chỉnh offer cho từng phân khúc", "c": "tailor an offer; segment your audience", "o": "offer the same thing to everyone", "e": "Tailor your offer to what each segment truly wants.", "eo": "Offering the same thing to everyone ignores what each segment wants.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 107.0}, {"id": 116, "w": "Evergreen / Launch-based / Trending / Time-sensitive / Seasonal", "i": "", "m": "các loại nội dung", "c": "evergreen content; launch-based promotion; trending topics; time-sensitive offer; seasonal campaign", "o": "", "e": "evergreen (funnel/content/sales page) → work 24/7 while you sleep → build sustainable income", "eo": "", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 108.0}, {"id": 117, "w": "Outline → Approve the outline", "i": "", "m": "dàn ý", "c": "write an outline; approve the outline", "o": "reject the outline", "e": "The client approved the outline before we started writing.", "eo": "Sometimes a client rejects the outline and asks for a new angle.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 109.0}, {"id": 118, "w": "Structure → Apply the PAS structure", "i": "", "m": "cấu trúc", "c": "apply a structure; follow the PAS structure", "o": "write without structure", "e": "We applied the PAS structure to organize the sales page.", "eo": "Writing without structure often leads to a confusing message.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 110.0}, {"id": 119, "w": "Angle → Find a new angle / Test different ad angles", "i": "", "m": "góc nhìn nội dung", "c": "find a new angle; test different angles", "o": "", "e": "Nail the content angle before writing", ung sáo rỗng / bản nháp được tinh chỉnh", "c": "cut the fluff; go through several iterations", "o": "", "e": "Cut the fluff and focus on what matters.", "eo": "", "t": "Business", "f": 3, "da": "2026-07-20", "fo": 117.0}, {"id": 126, "w": "Consume content (v)", "i": "", "m": "tiêu thụ nội dung", "c": "consume content; binge-consume content", "o": "create content", "e": "People consume content faster than ever on social media.", "eo": "Fewer people actually create content compared to those who consume it.", "t": "Business", "f": 0, "da": "2026-07-20", "fo": 118.0}, {"id": 127, "w": "Wake up (v)", "i": "/weɪk ʌp/", "m": "tỉnh dậy, mở mắt sau khi ngủ", "c": "wake up early; wake up feeling refreshed; wake up to the sound of birds chirping; wake up to the sound of my alarm", "o": "stay asleep", "e": "I try to wake up early every day to get more done.; After a full 8 hours, I woke up feeling refreshed.; In the countryside, I wake up to the sound of birds chirping every morning.; In the city, I wake up to the sound of my alarm instead.", "eo": "I hit snooze twice, hoping to stay asleep a little longer.", "t": "Daily Routine & Morning Habits", "f": 0, "da": "2026-07-20", "fo": 1.0}, {"id": 128, "w": "Snooze (v)", "i": "/snuːz/", "m": "bấm nút báo thức để ngủ thêm vài phút", "c": "hit the snooze button; snooze for a few more minutes", "o": "jump out of bed", "e": "I hit the snooze button three times before finally getting up.; He snoozed for a few more minutes and ended up being late.", "eo": "As soon as the alarm rang, she jumped out of bed.", "t": "Daily Routine & Morning Habits", "f": 0, "da": "2026-07-20", "fo": 2.0}, {"id": 129, "w": "Get up (v)", "i": "/ɡet ʌp/", "m": "rời khỏi giường, đứng dậy", "c": "get up on time; get up at the crack of dawn", "o": "stay in bed", "e": "I need to get up on time if I want to catch the bus.; Farmers often get up at the crack of dawn.", "eo": "It's Sunday, so I'll just stay in bed a bit longer.", "t": "Daily Routine & Morning Habits", ve been", "i": "", "m": "không bao giờ biết điều gì có thể xảy ra", "c": "never know what could've been", "o": "", "e": "If you never try, you'll never know what could have been.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 9.0}, {"id": 231, "w": "More times than I can count", "i": "", "m": "nhiều hơn số lần tôi có thể đếm", "c": "fail more times than you can count", "o": "", "e": "I've failed more times than I can count, but I keep going.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 10.0}, {"id": 232, "w": "The pain of regret is way heavier", "i": "", "m": "nỗi đau của sự hối tiếc nặng nề hơn nhiều", "c": "regret weighs heavier than failure", "o": "", "e": "The pain of regret is way heavier than the pain of failure.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 11.0}, {"id": 233, "w": "Stings deeper", "i": "", "m": "châm chích / đau sâu sắc hơn", "c": "regret stings deeper", "o": "", "e": "Regret stings deeper than any failure ever could.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 12.0}, {"id": 234, "w": "Regret hurts forever", "i": "", "m": "hối tiếc làm đau mãi mãi", "c": "regret lasts forever", "o": "", "e": "Regret hurts forever, but failure is temporary.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 13.0}, {"id": 235, "w": "Be stuck in inertia", "i": "", "m": "bị mắc kẹt trong quán tính (trì trệ)", "c": "be stuck in inertia", "o": "gain momentum", "e": "I've been stuck in inertia for months, unable to start anything new.", "eo": "Once she gained momentum, everything felt easier.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 14.0}, {"id": 236, "w": "Procrastination", "i": "", "m": "sự trì hoãn", "c": "fall into procrastination", "o": "take immediate action", "e": "Procrastination is the enemy of progress.", "eo": "He replaced procrastination with immediate action and got things done.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 15.0}, {"id": 237, "w": "Make the first move", "i": "", "m": "thực hiện bước đi đầu tiên", "c": "make the first move", "o": "hesitate to act", "e": "Sometimes you just have to make the first move and see what happens.", "eo": "She hesitated to act and missed the opportunity.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 16.0}, {"id": 238, "w": "It all starts with", "i": "", "m": "tất cả bắt đầu với", "c": "it all starts with a small step", "o": "", "e": "It all starts with a single step.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 17.0}, {"id": 239, "w": "They are the foundation", "i": "", "m": "chúng là nền tảng", "c": "form the foundation", "o": "", "e": "Small habits are the foundation of big success.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 18.0}, {"id": 240, "w": "Don't wait until you're big", "i": "", "m": "đừng đợi đến khi bạn lớn (thành công)", "c": "start small, not wait until big", "o": "", "e": "Don't wait until you're big to start — start small and grow.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 19.0}, {"id": 241, "w": "Inertia / Stagnation (n)", "i": "", "m": "quán tính / trì trệ", "c": "fall into inertia; suffer from stagnation", "o": "", "e": "Inertia and stagnation are the biggest threats to personal growth.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 20.0}, {"id": 242, "w": "Break / Disrupt / Overcome inertia", "i": "", "m": "phá vỡ / làm gián đoạn / vượt qua quán tính", "c": "break the cycle of inertia", "o": "give in to inertia", "e": "To grow, you must break inertia and take action.", "eo": "It's easy to give in to inertia and stay comfortable.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 21.0}, {"id": 243, "w": "Tear down", "i": "", "m": "phá bỏ", "c": "tear down old habits", "o": "", "e": "Sometimes you need to tear down old habits to build new ones.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 22.0}, {"id": 244, "w": "Cultivate", "i": "", "m": "vun đắp, trau dồi", "c": "cultivate a habit", "o": "", "e": "Cultivate patience and resilience through daily practice.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 23.0}, {"id": 245, "w": "Reclaim", "i": "", "m": "giành lại, đòi lại", "c": "reclaim your confidence", "o": "", "e": "She reclaimed her confidence after years of self-doubt.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 24.0}, {"id": 246, "w": "Stand back up", "i": "", "m": "đứng dậy trở lại", "c": "stand back up after falling", "o": "", "e": "No matter how many times you fall, stand back up.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 25.0}, {"id": 247, "w": "Treat my skills like cooking / Adjust the recipe", "i": "", "m": "xem kỹ năng như nấu ăn / điều chỉnh công thức", "c": "adjust the recipe (approach)", "o": "", "e": "I treat my skills like cooking — if something doesn't work, I adjust the recipe.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 26.0}, {"id": 248, "w": "Try your best / Give it your all / Put forth your fullest effort / Put in more reps", "i": "", "m": "cố gắng hết sức / nỗ lực tối đa / nỗ lực hết mình / thực hiện nhiều lần hơn", "c": "give it your all", "o": "put in minimal effort", "e": "Try your best and put in more reps — that's how you improve.", "eo": "He just put in minimal effort and got mediocre results.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 27.0}, {"id": 249, "w": "Keep going / Don't stop / Push on / Maintain momentum / Persist regardless / Don't skip a day of practice", "i": "", "m": "tiếp tục / đừng dừng lại / cố gắng tiếp / duy trì đà / kiên trì bất chấp / đừng bỏ qua một ngày luyện tập", "c": "keep going despite setbacks", "o": "give up", "e": "Keep going even when it's hard — don't skip a day of practice.", "eo": "Many people give up right before they would have succeeded.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 28.0}, {"id": 250, "w": "Enforce discipline on themselves", "i": "", "m": "tự rèn luyện kỷ luật", "c": "enforce self-discipline", "o": "", "e": "Successful people enforce discipline on themselves daily.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 29.0}, {"id": 251, "w": "Tolerate every obstacle", "i": "", "m": "chịu đựng mọi chướng ngại", "c": "tolerate obstacles along the way", "o": "", "e": "You have to tolerate every obstacle on the path to success.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 30.0}, {"id": 252, "w": "Grind (v/n) ; Grinding (adj)", "i": "", "m": "cày ải / vất vả", "c": "grind through the work", "o": "", "e": "The daily grind is tough, but it's worth it in the end.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 31.0}, {"id": 253, "w": "Gritty", "i": "", "m": "bền bỉ, gan dạ", "c": "show gritty determination", "o": "", "e": "She has a gritty determination that inspires everyone around her.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 32.0}, {"id": 254, "w": "Compounds over time", "i": "", "m": "tích lũy theo thời gian", "c": "small efforts compound over time", "o": "fizzle out quickly", "e": "Small efforts compound over time into extraordinary results.", "eo": "Motivation without a system often fizzles out quickly.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 33.0}, {"id": 255, "w": "Just 1% better than yesterday / 1% at a time / Upgrade yourself incrementally", "i": "", "m": "chỉ cần tốt hơn 1% mỗi ngày", "c": "get 1% better each day", "o": "", "e": "Just be 1% better than yesterday — upgrade yourself incrementally.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 34.0}, {"id": 256, "w": "Incremental progress is still progress / Don't underestimate small daily wins", "i": "", "m": "tiến bộ từng chút vẫn là tiến bộ / đừng coi thường những chiến thắng nhỏ hàng ngày", "c": "make incremental progress", "o": "", "e": "Incremental progress is still progress — collect the small wins every day.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 35.0}, {"id": 257, "w": "No overnight success", "i": "", "m": "không có thành công một sớm một chiều", "c": "there's no overnight success", "o": "", "e": "Remember, there's no overnight success — it takes years of hard work.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 36.0}, {"id": 258, "w": "Action builds proof", "i": "", "m": "hành động xây dựng bằng chứng", "c": "action builds proof", "o": "", "e": "Action builds proof — you can't just talk about it.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 1, "da": "2026-07-20", "fo": 37.0}, {"id": 259, "w": "Proof builds belief", "i": "", "m": "bằng chứng xây dựng niềm tin", "c": "proof builds belief", "o": "", "e": "Proof builds belief — once you see results, you start believing.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 38.0}, {"id": 260, "w": "Compounds into belief / Accumulates into belief", "i": "", "m": "tích tụ thành niềm tin", "c": "compound into belief", "o": "", "e": "Small wins compound into belief over time.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 39.0}, {"id": 261, "w": "Not through affirmation, but through evidence", "i": "", "m": "không qua khẳng định, mà qua bằng chứng", "c": "build belief through evidence", "o": "", "e": "Belief comes not through affirmation, but through evidence.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 40.0}, {"id": 262, "w": "Build momentum", "i": "", "m": "tạo đà phát triển", "c": "build momentum", "o": "lose momentum", "e": "Start with small wins to build momentum.", "eo": "Skipping a few days made her lose all her momentum.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 41.0}, {"id": 263, "w": "Once you're moving, you naturally do more", "i": "", "m": "một khi bạn đã bắt đầu, bạn sẽ tự nhiên làm nhiều hơn", "c": "gain momentum once you start", "o": "", "e": "Once you're moving, you naturally do more — it's the law of momentum.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 42.0}, {"id": 264, "w": "Build something from the inside out", "i": "", "m": "xây dựng từ bên trong", "c": "build from the inside out", "o": "", "e": "Build your character from the inside out, not the other way around.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 43.0}, {"id": 265, "w": "Break the cycle", "i": "", "m": "phá vỡ vòng luẩn quẩn", "c": "break the cycle", "o": "stay stuck in the cycle", "e": "You have to break the cycle of self-doubt to move forward.", "eo": "He stayed stuck in the same cycle for years.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 44.0}, {"id": 266, "w": "See real transformation", "i": "", "m": "nhìn thấy sự biến đổi thực sự", "c": "see real transformation", "o": "", "e": "After six months of consistency, I started to see real transformation.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 45.0}, {"id": 267, "w": "That's where the real change begins", "i": "", "m": "đó là nơi sự thay đổi thực sự bắt đầu", "c": "that's where change begins", "o": "", "e": "When you start believing in yourself, that's where the real change begins.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 46.0}, {"id": 268, "w": "You see yourself doing it naturally / It just flows", "i": "", "m": "bạn thấy mình làm một cách tự nhiên / nó trôi chảy", "c": "it just flows naturally", "o": "", "e": "After enough practice, you see yourself doing it naturally — it just flows.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 47.0}, {"id": 269, "w": "Manifest (v)", "i": "", "m": "hiện thực hóa, thể hiện rõ", "c": "manifest as results", "o": "", "e": "Consistent effort manifests as visible results over time.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 48.0}, {"id": 270, "w": "Render (v)", "i": "", "m": "biến đổi, khiến cho trở thành", "c": "render something effortless", "o": "", "e": "Consistent practice renders complex skills effortless.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 49.0}, {"id": 271, "w": "Move up", "i": "", "m": "thăng tiến, tiến lên", "c": "move up in your career", "o": "stay stagnant", "e": "If you keep working hard, you'll move up in your career.", "eo": "Without new skills, his career stayed stagnant.", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 50.0}, {"id": 272, "w": "Earn the promotion / Get the promotion", "i": "", "m": "giành được thăng chức", "c": "earn a promotion", "o": "", "e": "He worked tirelessly to earn the promotion.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 51.0}, {"id": 273, "w": "The final result", "i": "", "m": "kết quả cuối cùng", "c": "the final result matters", "o": "", "e": "The final result is what matters most.", "eo": "", "t": "Failure, Regret, Resilience & Incremental Progress", "f": 0, "da": "2026-07-20", "fo": 52.0}, {"id": 274, "w": "Talk behind their backs", "i": "", "m": "nói sau lưng", "c": "talk behind someone's back", "o": "", "e": "She always talks behind their backs — it's a toxic habit.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 1.0}, {"id": 275, "w": "Demean", "i": "", "m": "làm nhục, xúc phạm", "c": "demean someone", "o": "", "e": "Don't demean others to make yourself feel better.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 1, "da": "2026-07-20", "fo": 2.0}, {"id": 276, "w": "Criticize", "i": "", "m": "chỉ trích", "c": "criticize harshly", "o": "compliment / praise", "e": "Constructive feedback is helpful, but constant criticism is not.", "eo": "A good mentor praises progress as often as she corrects mistakes.", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 3.0}, {"id": 277, "w": "Discredit everything", "i": "", "m": "làm mất uy tín mọi thứ", "c": "discredit someone's work", "o": "", "e": "Some people try to discredit everything others say — don't be that person.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 4.0}, {"id": 278, "w": "Meeting with no agenda", "i": "", "m": "cuộc họp không có chương trình", "c": "hold a meeting with no agenda", "o": "", "e": "A meeting with no agenda is a waste of everyone's time.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 5.0}, {"id": 279, "w": "Pointless talk / Endless conversations", "i": "", "m": "cuộc trò chuyện vô nghĩa / bất tận", "c": "engage in pointless talk", "o": "", "e": "I try to avoid pointless talk and endless conversations that drain my energy.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 6.0}, {"id": 280, "w": "Take in whatever was around, good or bad", "i": "", "m": "tiếp nhận mọi thứ xung quanh, tốt hay xấu", "c": "take in everything around you", "o": "", "e": "I used to take in whatever was around, good or bad — now I curate carefully.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 7.0}, {"id": 281, "w": "Attend everything / Join every meeting", "i": "", "m": "tham dự mọi thứ / tham gia mọi cuộc họp", "c": "attend every meeting", "o": "", "e": "Attending everything and joining every meeting left me exhausted.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 8.0}, {"id": 282, "w": "Lower my voice", "i": "", "m": "hạ giọng", "c": "lower your voice", "o": "", "e": "I had to lower my voice to avoid disturbing the baby.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 9.0}, {"id": 283, "w": "Curate my inputs / Have that filter", "i": "", "m": "chọn lọc đầu vào / có bộ lọc đó", "c": "curate your inputs", "o": "", "e": "I curate my inputs carefully — I only consume content that adds value.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 1, "da": "2026-07-20", "fo": 10.0}, {"id": 284, "w": "Scrutinize what I watch", "i": "", "m": "soi xét những gì tôi xem", "c": "scrutinize your media intake", "o": "", "e": "I scrutinize what I watch because not all content is worth my time.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 11.0}, {"id": 285, "w": "Be mindful of the conversations I participate in, people I allow close", "i": "", "m": "cẩn trọng với các cuộc trò chuyện và những người tôi cho phép đến gần", "c": "be mindful of who you let close", "o": "", "e": "Be mindful of the conversations you participate in and the people you allow close.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 12.0}, {"id": 286, "w": "Deliberate", "i": "", "m": "có chủ ý, thận trọng", "c": "be deliberate about a decision", "o": "", "e": "Every decision I make is deliberate and thoughtful.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 1, "da": "2026-07-20", "fo": 13.0}, {"id": 287, "w": "Decline it / Say no to... not out of arrogance, but out of alignment", "i": "", "m": "từ chối, không phải vì kiêu ngạo mà vì không phù hợp", "c": "decline an invitation", "o": "", "e": "I decline invitations not out of arrogance, but out of alignment with my goals.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 1, "da": "2026-07-20", "fo": 14.0}, {"id": 288, "w": "Keep it out", "i": "", "m": "giữ nó ra ngoài", "c": "keep negativity out", "o": "", "e": "If it doesn't serve your growth, keep it out.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 1, "da": "2026-07-20", "fo": 15.0}, {"id": 289, "w": "Hold onto your standards", "i": "", "m": "giữ vững tiêu chuẩn của bạn", "c": "hold onto your standards", "o": "", "e": "Always hold onto your standards, even when it's hard.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 16.0}, {"id": 290, "w": "Hang out / Chat / Joke around with positive people who push you forward", "i": "", "m": "đi chơi / trò chuyện / đùa giỡn với những người tích cực thúc đẩy bạn", "c": "hang out with positive people", "o": "", "e": "I hang out with positive people who push me forward, not drag me down.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 1, "da": "2026-07-20", "fo": 17.0}, {"id": 291, "w": "Have way more time to do what serves my growth", "i": "", "m": "có nhiều thời gian hơn để làm những điều phục vụ sự phát triển", "c": "free up time for growth", "o": "", "e": "Since I stopped attending pointless meetings, I have way more time to do what serves my growth.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 18.0}, {"id": 292, "w": "Become who I'm committed to (becoming)", "i": "", "m": "trở thành người mà tôi cam kết trở thành", "c": "become who you're committed to being", "o": "", "e": "Through daily effort, I'm becoming who I'm committed to becoming.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 19.0}, {"id": 293, "w": "Hold the meetings that actually move your goals forward", "i": "", "m": "tổ chức các cuộc họp thực sự thúc đẩy mục tiêu", "c": "hold purposeful meetings", "o": "", "e": "Hold the meetings that actually move your goals forward, not just status updates.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 0, "da": "2026-07-20", "fo": 20.0}, {"id": 294, "w": "Voice your concerns / vision / disagreement / boundaries", "i": "", "m": "lên tiếng về mối quan tâm / tầm nhìn / bất đồng / ranh giới", "c": "voice your concerns", "o": "", "e": "Don't be afraid to voice your concerns and set boundaries.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 1, "da": "2026-07-20", "fo": 21.0}, {"id": 295, "w": "Carry yourself with confidence", "i": "", "m": "tự tin thể hiện bản thân", "c": "carry yourself with confidence", "o": "", "e": "Carry yourself with confidence, even when you're unsure inside.", "eo": "", "t": "Negative External Influences & Healthy Boundaries", "f": 1, "da": "2026-07-20", "fo": 22.0}, {"id": 296, "w": "Get straight to the point", "i": "", "m": "đi thẳng vào vấn đề", "c": "get straight to the point", "o": "beat around the bush", "e": "In business, it's best to get straight to the point.", "eo": "He kept beating around the bush instead of getting to the point.", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 1.0}, {"id": 297, "w": "I'd say...", "i": "", "m": "tôi muốn nói...", "c": "I'd say (opinion phrase)", "o": "", "e": "I'd say this is a great opportunity for growth.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 2.0}, {"id": 298, "w": "You know the drill", "i": "", "m": "bạn biết thủ tục rồi đấy", "c": "you know the drill", "o": "", "e": "You know the drill — start with research, then write the draft.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 3.0}, {"id": 299, "w": "Here's the thing", "i": "", "m": "vấn đề là...", "c": "here's the thing", "o": "", "e": "Here's the thing — we need to act now before it's too late.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 1, "da": "2026-07-20", "fo": 4.0}, {"id": 300, "w": "What it's like to be...", "i": "", "m": "cảm giác làm... như thế nào", "c": "what it's like to be someone", "o": "", "e": "What it's like to be a freelancer is both freeing and challenging.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 1, "da": "2026-07-20", "fo": 5.0}, {"id": 301, "w": "Don't treat it like... / Don't judge a book by its cover", "i": "", "m": "đừng đánh giá qua vẻ bề ngoài", "c": "don't judge a book by its cover", "o": "", "e": "Don't treat it like it's easy — and don't judge a book by its cover.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 1, "da": "2026-07-20", "fo": 6.0}, {"id": 302, "w": "Cheer for you / Root for you", "i": "", "m": "cổ vũ cho bạn", "c": "root for someone", "o": "", "e": "I'm always cheering for you and rooting for your success.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 7.0}, {"id": 303, "w": "Support you from afar", "i": "", "m": "ủng hộ bạn từ xa", "c": "support someone from afar", "o": "", "e": "Even though we're apart, I support you from afar.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 8.0}, {"id": 304, "w": "I totally get it", "i": "", "m": "tôi hoàn toàn hiểu", "c": "I totally get it", "o": "", "e": "I totally get it — you're feeling overwhelmed.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 9.0}, {"id": 305, "w": "No hard feelings", "i": "", "m": "không có ác cảm", "c": "no hard feelings", "o": "hold a grudge", "e": "If you choose the other option, no hard feelings.", "eo": "Instead of holding a grudge, she let it go with no hard feelings.", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 10.0}, {"id": 306, "w": "No sweat at all", "i": "", "m": "không vấn đề gì", "c": "no sweat at all", "o": "", "e": "No sweat at all — I'm happy to help.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 11.0}, {"id": 307, "w": "Don't take it personally", "i": "", "m": "đừng coi là chuyện cá nhân", "c": "don't take it personally", "o": "take it to heart", "e": "It's just feedback — don't take it personally.", "eo": "He took the joke to heart instead of letting it go.", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 12.0}, {"id": 308, "w": "Either way", "i": "", "m": "dù thế nào đi nữa", "c": "either way, it's fine", "o": "", "e": "Either way, we'll find a solution.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 13.0}, {"id": 309, "w": "Stay with you", "i": "", "m": "ở bên bạn", "c": "stay with someone", "o": "", "e": "I'll stay with you until you feel better.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 14.0}, {"id": 310, "w": "As always", "i": "", "m": "như mọi khi", "c": "as always", "o": "", "e": "As always, you've done a great job.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 15.0}, {"id": 311, "w": "Just one of those days", "i": "", "m": "chỉ là một trong những ngày như vậy", "c": "just one of those days", "o": "", "e": "Don't worry, it's just one of those days.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 16.0}, {"id": 312, "w": "Tons of / Loads of / A substantial volume of", "i": "", "m": "rất nhiều / một lượng lớn", "c": "tons of work", "o": "", "e": "I have tons of work to do this weekend.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 17.0}, {"id": 313, "w": "Thrilled / Over the moon / Genuinely delighted", "i": "", "m": "vô cùng phấn khích / cực kỳ vui mừng", "c": "be thrilled with the results", "o": "", "e": "I'm thrilled with the results of the project.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 18.0}, {"id": 314, "w": "Hits me differently / Hit me hard", "i": "", "m": "tác động đến tôi khác / làm tôi bàng hoàng", "c": "hit someone hard", "o": "", "e": "That song hits me differently every time I hear it.", "eo": "", "t": "Everyday Social Communication & Emotional Expression", "f": 0, "da": "2026-07-20", "fo": 19.0}, {"id": 315, "w": "Feels off", "i": "", "m": "cảm thấy không ổn", "c": "something feels off", "o": "", "e": "Something about this situation feels off.", "eo": "", "t": "Everyday Social Communication ke this).", "eo": "", "t": "Punctuation & Writing Mechanics", "f": 1, "da": "2026-07-20", "fo": 4.0}, {"id": 359, "w": "Mindset shift (n)", "i": "/ˈmaɪndset ʃɪft/", "m": "sự thay đổi tư duy", "c": "have a mindset shift; undergo a mindset shift", "o": "stick to old beliefs", "e": "She underwent a mindset shift about friendships after being betrayed by her close friends.", "eo": "Some people stick to old beliefs even after clear evidence they no longer serve them.", "t": "Money, Budgeting & Smart Spending", "f": 0, "da": "2026-08-08", "fo": 1.0}, {"id": 360, "w": "Financial literacy (n)", "i": "/faɪˈnænʃəl ˈlɪtərəsi/", "m": "hiểu biết về tài chính", "c": "improve financial literacy; promote financial literacy", "o": "financial illiteracy", "e": "She improved her financial literacy through books, podcasts, courses and real investment.", "eo": "Financial illiteracy often leads to poor money decisions and unnecessary debt.", "t": "Money, Budgeting & Smart Spending", "f": 0, "da": "2026-08-08", "fo": 2.0}, {"id": 361, "w": "Budget (v/n)", "i": "/ˈbʌdʒɪt/", "m": "lập ngân sách", "c": "stick to a budget; create a budget", "o": "overspend", "e": "Always build a budget to ensure you do not overspend on unnecessary things.", "eo": "He tends to overspend whenever he doesn't stick to a budget.", "t": "Money, Budgeting & Smart Spending", "f": 0, "da": "2026-08-08", "fo": 3.0}, {"id": 362, "w": "Track your spending (v)", "i": "/træk jɔːr ˈspendɪŋ/", "m": "theo dõi chi tiêu", "c": "track your spending habits; use an app to track spending", "o": "ignore your spending", "e": "You can track your spending habits by using some mobile apps.", "eo": "Choosing to ignore your spending usually leads to surprises at the end of the month.", "t": "Money, Budgeting & Smart Spending", "f": 0, "da": "2026-08-08", "fo": 4.0}, {"id": 363, "w": "Cut back on (v)", "i": "/kʌt bæk ɒn/", "m": "cắt giảm", "c": "cut back on expenses; cut back on dining out", "o": "splurge on", "e": "He tried to cut back on Action items | đầu việc cần làm | assign action items; review action items | vague promises | I'll send the action items by end of day. | They made vague promises, and nobody took ownership.
By end of day | trước cuối ngày | send it by end of day; by EOD | at some point | I'll send the proposal by end of day. | He said he'd send it at some point, which wasn't helpful.
Take ownership | nhận trách nhiệm | take ownership of the task; take full ownership | pass the buck | I'll take ownership of the first draft. | He passed the buck instead of fixing it.
Touch base | giữ liên lạc, trao đổi nhanh | touch base next week; touch base briefly | go silent | Let's touch base next week to review progress. | The agency went silent for two weeks.
#Daily: Opinions
In my opinion | theo tôi | in my opinion; if you ask me | I see it differently | In my opinion, the second option is better. | I see it differently. I think it's too risky.
I couldn't agree more | hoàn toàn đồng ý | couldn't agree more; totally agree | I'm not convinced | I couldn't agree more with your point. | I'm not convinced that will work.
To be honest | thành thật mà nói | to be honest; to be frank | sugarcoat | To be honest, I think we're rushing. | She sugarcoated the news instead of being honest.
Have mixed feelings about | cảm xúc lẫn lộn về | have mixed feelings; be torn between | be dead set on | I have mixed feelings about moving abroad. | He's dead set on moving abroad.
Agree to disagree | đồng ý là bất đồng | agree to disagree; fair enough | reach a consensus | We agreed to disagree and moved on. | After a long talk, we reached a consensus.
`;
function ing(txt,t0){let n=0,d=0,t=t0;const have=new Set(all().map(c=>c.w.toLowerCase()));txt.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]=='#'){t=l.slice(1).trim();return}const p=l.split('|').map(x=>x.trim());if(p.length<2||!p[0])return;if(have.has(p[0].toLowerCase())){d++;return}have.add(p[0].toLowerCase());S.x.push({id:1000+S.x.length,w:p[0],i:'',m:p[1],c:p[2]||'',o:p[3]||'',e:p[4]||'',eo:p[5]||'',t:t||'Mới',f:0,da:TD,fo:1+Math.max(0,...all().filter(c=>c.t==(t||'Mới')).map(c=>c.fo||0))});n++});S.al=S.al||{};S.al[TD]=(S.al[TD]||0)+n;sv();Q=[];qi=0;return[n,d]}
function rel(){if(stats().due>80){alert('Đang có hơn 80 thẻ đến hạn. Ôn xuống dưới 50 rồi hãy nhận từ mới.');return}const days=PK.split(/^@\d+\n/m).slice(1),r=ing(days[S.pk],'');S.pk++;sv();alert('Đã thêm '+r[0]+' cụm (bỏ '+r[1]+' trùng)');draw()}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';return 'word,ipa,meaning,collocations,opposite,example,example_opposite,topic,date_added,flow_order,box,last_review,next_due,fail,reviews\n'+all().map(c=>{const s=st(c);return[c.w,c.i,c.m,c.c,c.o,c.e,c.eo,c.t,c.da,c.fo,s.b,s.l||'',s.due,s.f,s.n].map(q).join(',')}).join('\n')}
let Q=[],qi=0,show=0,tab=0,done=0;
function build(extra=0){const A=all();const lee=A.filter(c=>st(c).f>=3&&st(c).due<=TD).slice(0,3);
const fresh=A.filter(c=>st(c).b==0&&!st(c).n).sort((a,b)=>b.id-a.id);
const due=A.filter(c=>st(c).b>0&&st(c).due<=TD&&!lee.includes(c)).sort((a,b)=>st(a).b-st(b).b);
const seen=new Set();Q=[];const push=l=>l.forEach(c=>{if(!seen.has(c.id)&&Q.length<S.cap+extra){seen.add(c.id);Q.push(c)}});
push(lee);push(fresh.slice(0,10));push(due.slice(0,15));push(fresh);push(due);qi=0;show=0}
function stats(){const A=all(),s=A.map(st);return{tot:A.length,nw:s.filter(x=>!x.n&&x.b==0).length,due:s.filter(x=>x.b>0&&x.due<=TD).length,ok:s.filter(x=>x.b>=4).length,lee:s.filter(x=>x.f>=3).length}}
function grade(g){const c=Q[qi],s=Object.assign({},st(c));s.n=(s.n||0)+1;s.l=TD;
if(g=='ok'){s.b=s.b==0?2:Math.min(5,s.b+1);s.f=0}else if(g=='mid'){s.b=Math.max(1,s.b);}else{s.b=1;s.f++}
s.due=add(g=='ok'?IV[s.b]:1);S.c[c.id]=s;S.log[TD]=(S.log[TD]||0)+1;sv();qi++;show=0;done++;draw()}
function say(w){try{const u=new SpeechSynthesisUtterance(w.split('/')[0]);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(x){}}
function today(){const x=stats(),V=document.getElementById('v');
if(!Q.length&&qi==0)build();
if(qi>=Q.length){V.innerHTML=`<div class="card"><div class="mu">Còn ${left} ngày đến hết 31/12/2026</div><div class="g" style="margin:10px 0"><div><div class="n">${x.nw}</div><span class="mu">chưa ôn lần nào</span></div><div><div class="n y">${x.due}</div><span class="mu">đến hạn</span></div><div><div class="n a">${x.ok}</div><span class="mu">đã vững</span></div></div><div class="bar"><i style="width:${Math.round(x.ok/x.tot*100)}%"></i></div><p class="mu">Hôm nay đã ôn ${S.log[TD]||0} thẻ · ${x.lee} từ “leech” · tổng ${x.tot}</p>${S.pk<6?`<button id="pk" style="width:100%;margin-bottom:8px">＋ Nhận 10 cụm mới: ngày ${S.pk+1}/6</button>`:''}<button class="p" style="width:100%" id="go">${done?'Học thêm 10 thẻ':'Bắt đầu phiên hôm nay ('+Math.min(S.cap,x.nw+x.due)+' thẻ)'}</button><p class="mu">Thứ tự: leech → 10 từ MỚI NHẤT → đến hạn → backlog (mới → cũ). Số thẻ/ngày:</p><select id="cap">${[15,20,30,40,60].map(n=>`<option ${n==S.cap?'selected':''}>${n}</option>`).join('')}</select></div>`;
document.getElementById('go').onclick=()=>{build(done?10:0);Q.length?draw():alert('Hết thẻ cho hôm nay 🎉')};const pb=document.getElementById('pk');if(pb)pb.onclick=rel;document.getElementById('cap').onchange=ev=>{S.cap=+ev.target.value;sv()};return}
const c=Q[qi],s=st(c);
V.innerHTML=`<div class="bar"><i style="width:${qi/Q.length*100}%"></i></div><p class="mu">${qi+1}/${Q.length} · <span class="chip">${e(c.t)}</span><span class="chip">box ${s.b}</span>${s.f?`<span class="chip r">sai ${s.f}</span>`:''}</p><div class="card"><div class="mu">Nghĩa — nhớ ra tiếng Anh (nói thành tiếng!)</div><div class="big">${e(c.m)}</div><div class="mu" style="margin-top:6px">Gợi ý: ${e(hint(c.w))}</div>
${show?`<hr style="border:0;border-top:1px solid var(--bd)"><div class="big a">${e(c.w)} <button id="sp" style="padding:2px 8px">🔊</button></div><div class="mu">${e(c.i)}</div><h4>Collocations</h4>${e(c.c)}${c.o?`<h4>Đối lập</h4>${e(c.o)}`:''}<h4>Ví dụ</h4>${e(c.e)}${c.eo?'<br>'+e(c.eo):''}`:''}</div>
${show?`<div class="row3"><button id="g0" class="r">Quên</button><button id="g1" class="y">Mơ hồ</button><button id="g2" class="a">Nhớ</button></div>`:`<button class="p" style="width:100%" id="rv">Hiện đáp án</button>`}`;
if(show){document.getElementById('g0').onclick=()=>grade('no');document.getElementById('g1').onclick=()=>grade('mid');document.getElementById('g2').onclick=()=>grade('ok');document.getElementById('sp').onclick=()=>say(c.w)}else document.getElementById('rv').onclick=()=>{show=1;draw()}}
function story(t){const b=document.getElementById('sty');if(!t){b.innerHTML='';return}S.sy=S.sy||{};const tx=S.sy[t]||'';let h=e(tx);all().filter(c=>c.t==t).map(c=>c.w.split('/')[0].trim()).filter(Boolean).sort((a,b)=>b.length-a.length).forEach(k=>{h=h.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<b class="a">$1</b>')});
b.innerHTML=`<div class="card"><b>Đoạn liên kết: ${e(t)}</b><p>${h||'<span class="mu">Chưa có. Nhờ Claude viết đoạn văn nối các cụm theo đúng thứ tự bên dưới rồi dán vào đây.</span>'}</p><textarea id="st" rows="4">${e(tx)}</textarea><button id="ss" style="margin-top:6px">Lưu đoạn</button></div>`;document.getElementById('ss').onclick=()=>{S.sy[t]=document.getElementById('st').value;sv();story(t)}}
function list(){const T=[...new Set(all().map(c=>c.t))];document.getElementById('v').innerHTML=`<input id="q" placeholder="Tìm từ / nghĩa…"><select id="ft" style="margin:8px 0"><option value="">Mọi chủ đề</option>${T.map(t=>`<option>${e(t)}</option>`).join('')}</select><div id="sty"></div><div id="l"></div>`;
const f=()=>{const q=document.getElementById('q').value.toLowerCase(),t=document.getElementById('ft').value;document.getElementById('l').innerHTML=all().filter(c=>(!t||c.t==t)&&(c.w+c.m).toLowerCase().includes(q)).sort((a,b)=>t?(a.fo||a.id)-(b.fo||b.id):b.id-a.id).slice(0,t?200:80).map(c=>`<div class="it"><b>${e(c.w)}</b> <span class="mu">${e(c.i)}</span><br>${e(c.m)}<div class="mu">${e(c.c)}</div><div class="mu">nạp ${c.da||'?'} · ôn gần nhất ${(S.c[c.id]||{}).l||'chưa'} · ôn tiếp ${(S.c[c.id]||{}).due||'—'}</div></div>`).join('');story(t)};
document.getElementById('q').oninput=f;document.getElementById('ft').onchange=f;f()}
function tools(){document.getElementById('v').innerHTML=`<div class="card"><b>Thêm từ mới</b><p class="mu">Mỗi dòng: cụm | nghĩa | collocations | trái nghĩa | ví dụ collocations | ví dụ trái nghĩa. Dòng bắt đầu bằng # là tên chủ đề. Từ trùng tự bị bỏ.</p><input id="tp" placeholder="Chủ đề (vd: Client Meetings)"><textarea id="nw" rows="5"></textarea><button class="p" id="ad" style="margin-top:8px;width:100%">Thêm</button></div><div class="card"><b>Sao lưu tiến độ</b><p class="mu">Tiến độ lưu trong trình duyệt này. Copy đoạn dưới để cất vào Notes; dán lại + “Khôi phục” khi đổi máy.</p><textarea id="bk" rows="4">${e(JSON.stringify(S))}</textarea><button id="rs" style="margin-top:8px;width:100%">Khôi phục từ đoạn dán</button></div><div class="card"><b>Xuất CSV</b><p class="mu">Copy đoạn này dán vào Notes/Excel làm bản backup hằng tháng.</p><textarea id="cs" rows="4" readonly></textarea></div>`;
document.getElementById('ad').onclick=()=>{const r=ing(document.getElementById('nw').value,document.getElementById('tp').value||'Mới');alert('Đã thêm '+r[0]+' cụm (bỏ '+r[1]+' trùng)');return;const t=document.getElementById('tp').value||'Mới';let n=0;document.getElementById('nw').value.split('\n').forEach(l=>{const p=l.split('|').map(x=>x.trim());if(p[0]&&p[1]){S.x.push({id:1000+S.x.length,w:p[0],i:'',m:p[1],c:p[2]||'',o:'',e:p[3]||'',eo:'',t,f:0});n++}});sv();Q=[];alert('Đã thêm '+n+' từ')};
document.getElementById('cs').value=csv();document.getElementById('rs').onclick=()=>{try{S=Object.assign(S,JSON.parse(document.getElementById('bk').value));sv();Q=[];alert('Đã khôi phục')}catch(x){alert('Dữ liệu không hợp lệ')}}}
function prog(){const A=all(),s=A.map(st),x=stats(),B=[0,1,2,3,4,5].map(b=>s.filter(v=>b?v.b==b:(v.b==0)).length),L=S.log||{},AL=S.al||{};
const rv=Object.values(L).reduce((a,b)=>a+b,0),tg=1000,ad=S.x.length;
const ds=[...new Set(Object.keys(L).concat(Object.keys(AL)))].sort().reverse().slice(0,14);
let sk=0,d=new Date();if(!L[iso(d)])d.setDate(d.getDate()-1);while(L[iso(d)]){sk++;d.setDate(d.getDate()-1)}
const T={};A.forEach((c,i)=>{const o=T[c.t]=T[c.t]||{n:0,r:0,v:0};o.n++;if(s[i].n)o.r++;if(s[i].b>=4)o.v++});
const lee=A.filter((c,i)=>s[i].f>=3).slice(0,10);
document.getElementById('v').innerHTML=`<div class="card"><b>Tổng quan</b><div class="g" style="margin:10px 0"><div><div class="n">${x.tot}</div><span class="mu">tổng từ</span></div><div><div class="n a">${ad}</div><span class="mu">đã nạp thêm / ${tg}</span></div><div><div class="n">${rv}</div><span class="mu">lượt ôn</span></div></div><div class="bar"><i style="width:${Math.min(100,ad/tg*100)}%"></i></div><p class="mu">Chuỗi ngày ôn liên tiếp: ${sk} · Còn ${left} ngày · Cần nạp ~${Math.max(0,Math.ceil((tg-ad)/Math.max(1,left-14)))} cụm/ngày để đạt ${tg}</p></div>
<div class="card"><b>Phân bố mức nhớ</b><p class="mu">Chưa ôn: ${B[0]} · Box1 (1 ngày): ${B[1]} · Box2 (3 ngày): ${B[2]} · Box3 (7 ngày): ${B[3]} · Box4 (14 ngày): ${B[4]} · Box5 (30 ngày): ${B[5]}<br>Đến hạn hôm nay: ${x.due} · Leech: ${x.lee}</p></div>
<div class="card"><b>14 ngày gần nhất</b>${ds.length?ds.map(k=>`<div class="it">${k.slice(8)}/${k.slice(5,7)}: ôn <b>${L[k]||0}</b> thẻ · nạp mới <b>${AL[k]||0}</b></div>`).join(''):'<p class="mu">Chưa có dữ liệu.</p>'}</div>
<div class="card"><b>Theo chủ đề</b>${Object.keys(T).sort((a,b)=>T[b].n-T[a].n).map(k=>`<div class="it">${e(k)}<br><span class="mu">${T[k].n} từ · đã ôn ${T[k].r} · vững ${T[k].v}</span></div>`).join('')}</div>
${lee.length?`<div class="card"><b>Từ hay sai (leech)</b>${lee.map(c=>`<div class="it">${e(c.w)} <span class="mu">${e(c.m)}</span></div>`).join('')}</div>`:''}`}
function draw(){[0,1,2,3].forEach(i=>document.getElementById('t'+i).className=i==tab?'on':'');[today,list,tools,prog][tab]()}
[0,1,2,3].forEach(i=>document.getElementById('t'+i).onclick=()=>{tab=i;draw()});
document.addEventListener('keydown',ev=>{if(tab||qi>=Q.length||/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))return;if(!show&&(ev.key==' '||ev.key=='Enter')){ev.preventDefault();show=1;draw()}else if(show){if(ev.key=='1')grade('no');if(ev.key=='2')grade('mid');if(ev.key=='3')grade('ok')}});
draw();
</script></body></html>
